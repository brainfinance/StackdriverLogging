name: test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize, ready_for_review] }
  push: { branches: [ master ] }

jobs:
  unit-tests:
    if: ${{ !(github.event.pull_request.draft || false) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        traits: [ '', '--enable-all-traits' ]
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    timeout-minutes: 30
    steps:
      - name: Install zstd
        run: apt-get update -yq && apt-get install -y zstd
      - name: Check out code
        uses: actions/checkout@v7
      - name: Cache .build
        uses: actions/cache@v6
        with:
          path: .build
          key: swift-6.4-noble${{ matrix.traits }}-build-${{ github.event.pull_request.base.sha || github.event.after }}
          restore-keys: swift-6.4-noble${{ matrix.traits }}-build-
      - name: Run unit tests
        run: swift test ${{ matrix.traits }} --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable

  submit-dependencies:
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' }}
    uses: vapor/ci/.github/workflows/submit-deps.yml@main
    secrets: inherit
